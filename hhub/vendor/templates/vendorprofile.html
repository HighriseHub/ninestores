<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add/Edit Vendor Profile</title>

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }
    .form-card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 0.125rem 0.625rem rgba(0, 0, 0, 0.08);
      max-width: 800px;
      margin: 0 auto;
    }
    .profile-img {
      max-height: 60px;
      margin: 0 auto 1.25rem auto;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row">
    <div class="col-12 col-sm-10 offset-sm-1 col-md-8 offset-md-2">
      <div class="form-card">

        <div class="form-vendorprofile">
          <!--VENDOR_PROFILE_FORM_BEGIN-->
          <img class="profile-img" src="/img/logo.png" alt="Company Logo">

          <!-- Navigation Tabs -->
          <ul class="nav nav-tabs" id="vendorTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic" type="button" role="tab" aria-controls="basic" aria-selected="true">Basic Info</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="company-tab" data-bs-toggle="tab" data-bs-target="#company" type="button" role="tab" aria-controls="company" aria-selected="false">Company Details</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="gst-tab" data-bs-toggle="tab" data-bs-target="#gst" type="button" role="tab" aria-controls="gst" aria-selected="false">GST &amp; Tax</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab" aria-controls="contact" aria-selected="false">Contact Person</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="payment-tab" data-bs-toggle="tab" data-bs-target="#payment" type="button" role="tab" aria-controls="payment" aria-selected="false">Payment Gateway</button>
            </li>
          </ul>

          <!-- Tab Content Panes -->
          <div class="tab-content pt-3" id="vendorTabsContent">

            <!-- Tab 1: Basic Info -->
            <div class="tab-pane fade show active" id="basic" role="tabpanel" aria-labelledby="basic-tab">
              <div class="mb-3">
                <input class="form-control" name="cid" type="hidden" value="%Vendor ID%">
              </div>
              <div class="mb-3">
                <input class="form-control" name="name" maxlength="70" placeholder="Vendor Name *" type="text" value="%Vendor Name%" required>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <input class="form-control" name="email" maxlength="255" placeholder="Email *" type="email" value="%Vendor Email%" required>
                </div>
                <div class="col-6">
                  <input class="form-control" name="phone" maxlength="30" placeholder="Phone *" type="text" value="%Vendor Phone%" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" name="address" maxlength="200" placeholder="Address (max 200 characters) *" rows="2" required>%Vendor Address%</textarea>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <input class="form-control" name="city" maxlength="256" placeholder="City" type="text" value="%Vendor City%">
                </div>
                <div class="col-6">
                  <input class="form-control" name="state" maxlength="256" placeholder="State" type="text" value="%Vendor State%">
                </div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <input class="form-control" name="zipcode" maxlength="10" placeholder="Pincode" type="text" value="%Vendor Zipcode%">
                </div>
                <div class="col-6">
                  <input class="form-control" name="country" maxlength="256" placeholder="Country" type="text" value="%Vendor Country%">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label d-block">Active: </label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="activeflag" id="activeY" value="Y" checked>
                  <label class="form-check-label" for="activeY">Yes</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="activeflag" id="activeN" value="N">
                  <label class="form-check-label" for="activeN">No</label>
                </div>
              </div>
            </div>

            <!-- Tab 2: Company Details -->
            <div class="tab-pane fade" id="company" role="tabpanel" aria-labelledby="company-tab">
              <div class="alert alert-success d-flex align-items-center mb-3" role="alert">
                <i class="fa-solid fa-building me-2"></i>
                <div>Company identity used on tax invoices and for selling on the marketplace.</div>
              </div>
              <div class="mb-3">
                <input class="form-control" name="legal-name" maxlength="255" placeholder="Legal Company Name *" type="text" value="%Vendor Legal Name%" required>
              </div>
              <div class="mb-3">
                <input class="form-control" name="trade-name" maxlength="255" placeholder="Trade Name / Brand" type="text" value="%Vendor Trade Name%">
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <input class="form-control" name="pan-number" maxlength="10" placeholder="PAN Number" type="text" value="%Vendor PAN Number%">
                </div>
                <div class="col-6">
                  <input class="form-control" name="fy-start-month" placeholder="Financial Year Start Month (1-12)" type="number" min="1" max="12" value="%Vendor FY Start Month%">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Approval Status</label>
                %Vendor Approval Status%
              </div>
            </div>

            <!-- Tab 3: GST & Tax -->
            <div class="tab-pane fade" id="gst" role="tabpanel" aria-labelledby="gst-tab">
              <div class="mb-3">
                <input class="form-control" name="gstnumber" maxlength="20" placeholder="GST Number *" type="text" value="%Vendor GST Number%" required>
              </div>
              <div class="mb-3">
                <input class="form-control" name="gst-state-code" maxlength="2" placeholder="GST State Code (e.g. MH)" type="text" value="%Vendor GST State Code%">
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label">GST Registration Type</label>
                  %Vendor GST Registration Type%
                </div>
                <div class="col-6">
                  <label class="form-label">GST Filing Frequency</label>
                  %Vendor GST Filing Frequency%
                </div>
              </div>
            </div>

            <!-- Tab 4: Contact Person -->
            <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <input class="form-control" name="firstname" maxlength="50" placeholder="First Name" type="text" value="%Vendor First Name%">
                </div>
                <div class="col-6">
                  <input class="form-control" name="lastname" maxlength="50" placeholder="Last Name" type="text" value="%Vendor Last Name%">
                </div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <input class="form-control" name="salutation" maxlength="10" placeholder="Salutation (Mr/Mrs/Ms)" type="text" value="%Vendor Salutation%">
                </div>
                <div class="col-6">
                  <input class="form-control" name="birthdate" maxlength="10" placeholder="Birth Date (YYYY-MM-DD)" type="text" value="%Vendor Birth Date%">
                </div>
              </div>
              <div class="mb-3">
                <input class="form-control" name="title" maxlength="255" placeholder="Title / Designation" type="text" value="%Vendor Title%">
              </div>
            </div>

            <!-- Tab 5: Payment Gateway -->
            <div class="tab-pane fade" id="payment" role="tabpanel" aria-labelledby="payment-tab">
              <div class="alert alert-info d-flex align-items-center mb-3" role="alert">
                <i class="fa-solid fa-circle-info me-2"></i>
                <div>Payment gateway credentials issued by the payment partner.</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Payment Gateway Mode</label>
                %Vendor Payment Gateway Mode%
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <input class="form-control" name="payment-api-key" maxlength="40" placeholder="Payment API Key" type="text" value="%Vendor Payment API Key%">
                </div>
                <div class="col-6">
                  <input class="form-control" name="payment-api-salt" maxlength="40" placeholder="Payment API Salt" type="text" value="%Vendor Payment API Salt%">
                </div>
              </div>
              <div class="mb-3">
                <input class="form-control" name="upi-id" maxlength="70" placeholder="UPI ID" type="text" value="%Vendor UPI ID%">
              </div>
            </div>

          </div>

          <!-- Submit Button -->
          <div class="mt-4">
            <button class="btn btn-lg btn-primary w-100" type="submit">Submit Vendor Details</button>
          </div>
          <!--VENDOR_PROFILE_FORM_END-->

        </div>

      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5.3.3 JS Bundle (Includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
