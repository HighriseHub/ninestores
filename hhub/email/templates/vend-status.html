<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your registration status</title>
</head>
<body style="margin:0; padding:24px; background:#f1f5f9; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
  <div style="max-width:600px; margin:0 auto; background:#ffffff; border-radius:8px; padding:32px;">
    <p style="font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#64748b; margin:0 0 10px;">%CompanyName%</p>
    <h1 style="font-size:22px; line-height:1.3; margin:0 0 18px;">Your registration status</h1>
    <p style="font-size:15px; line-height:1.6; margin:0 0 12px;">Hi %VendorName%,</p>
    <p style="font-size:15px; line-height:1.6; margin:0 0 12px;">%StateLine%</p>
    <p style="font-size:15px; line-height:1.6; margin:0 0 12px;">%NextStepLine%</p>
    %ActionBlock%
    <p style="font-size:13px; line-height:1.6; color:#64748b; margin:24px 0 0;">Need help? Write to <a href="mailto:%SupportEmail%" style="color:#2563eb;">%SupportEmail%</a>.</p>
  </div>
</body>
</html>
